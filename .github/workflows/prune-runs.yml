name: prune-runs

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep 5 newest runs per workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KEEP: "5"
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GH_REPO}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | {id, workflow_id, status, created_at, name}' \
            > /tmp/runs.jsonl
          if [[ ! -s /tmp/runs.jsonl ]]; then
            echo "No workflow runs found."
            exit 0
          fi
          jq -s --argjson keep "${KEEP}" '
            group_by(.workflow_id)
            | map(
                sort_by(.created_at) | reverse
                | .[$keep:]
                | map(select(
                    .status != "in_progress"
                    and .status != "queued"
                    and .status != "waiting"
                    and .status != "requested"
                    and .status != "pending"
                  ))
              )
            | add // []
          ' /tmp/runs.jsonl > /tmp/delete.json
          kept="$(jq -s --argjson keep "${KEEP}" '
            group_by(.workflow_id)
            | map({workflow: .[0].name, keep: (.[0:$keep] | length), total: length})
          ' /tmp/runs.jsonl)"
          echo "Per workflow (keep ${KEEP} newest):"
          echo "${kept}"
          deleted=0
          failed=0
          while read -r id; do
            [[ -z "${id}" ]] && continue
            echo "DELETE run ${id}"
            if gh api --method DELETE "repos/${GH_REPO}/actions/runs/${id}"; then
              deleted=$((deleted + 1))
            else
              echo "warn: failed to delete ${id}" >&2
              failed=$((failed + 1))
            fi
          done < <(jq -r '.[].id' /tmp/delete.json)
          echo "Deleted ${deleted}; failed ${failed}."
          if [[ "${failed}" -gt 0 ]]; then
            exit 1
          fi
